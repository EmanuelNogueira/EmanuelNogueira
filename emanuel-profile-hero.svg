<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Emanuel Nogueira — Web Developer and Shopify Specialist</title>
  <desc id="desc">Dark technological profile banner with neon purple and cyan accents and a code terminal.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#11132A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.52" stop-color="#6C3BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="70" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 72) rotate(141.8) scale(320 230)">
      <stop stop-color="#6C3BFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#6C3BFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#7682A4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <circle cx="1125" cy="-12" r="170" stroke="#8B5CF6" stroke-opacity="0.14"/>
    <circle cx="1125" cy="-12" r="126" stroke="#22D3EE" stroke-opacity="0.12"/>
    <circle cx="1125" cy="-12" r="82" fill="#6C3BFF" fill-opacity="0.05"/>
    <path d="M0 326C175 278 300 383 492 323C677 265 763 268 925 312C1045 345 1124 339 1200 314V360H0V326Z" fill="#6C3BFF" fill-opacity="0.08"/>

    <rect x="58" y="44" width="5" height="272" rx="2.5" fill="url(#accent)"/>
    <rect x="84" y="45" width="220" height="28" rx="14" fill="#121A2B" stroke="#293554"/>
    <circle cx="101" cy="59" r="4" fill="#22D3EE" filter="url(#softGlow)"/>
    <text x="115" y="64" fill="#9EAAC6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">EMANUEL.DEV // PROFILE</text>

    <text x="84" y="143" fill="#F7F8FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.5">EMANUEL</text>
    <text x="84" y="199" fill="url(#accent)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="1.5">NOGUEIRA</text>
    <text x="86" y="235" fill="#C7D0E4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="650" letter-spacing="1.2">WEB DEVELOPER  ·  SHOPIFY SPECIALIST  ·  REACT</text>
    <rect x="84" y="258" width="540" height="2" rx="1" fill="url(#line)"/>
    <text x="84" y="291" fill="#8390AD" font-family="JetBrains Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1.25">4 YEARS  /  COMMERCE  /  SAAS  /  PERFORMANCE</text>

    <g filter="url(#shadow)">
      <rect x="700" y="48" width="438" height="264" rx="18" fill="#0A0F1B" stroke="#2A3552" stroke-width="1.2"/>
      <rect x="700" y="48" width="438" height="42" rx="18" fill="#11182A"/>
      <path d="M700 72C700 58.745 710.745 48 724 48H1114C1127.25 48 1138 58.745 1138 72V90H700V72Z" fill="#11182A"/>
      <circle cx="727" cy="69" r="5" fill="#FF5F57"/>
      <circle cx="745" cy="69" r="5" fill="#FEBC2E"/>
      <circle cx="763" cy="69" r="5" fill="#28C840"/>
      <text x="919" y="74" text-anchor="middle" fill="#7D89A5" font-family="JetBrains Mono, Consolas, monospace" font-size="11">emanuel@web: ~/profile</text>

      <text x="728" y="119" fill="#22D3EE" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">$</text>
      <text x="747" y="119" fill="#D6DCEF" font-family="JetBrains Mono, Consolas, monospace" font-size="14">whoami --stack</text>

      <text x="728" y="151" fill="#8B5CF6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">const</text>
      <text x="779" y="151" fill="#F7F8FC" font-family="JetBrains Mono, Consolas, monospace" font-size="14">focus = {</text>

      <text x="748" y="179" fill="#9EAAC6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">commerce:</text>
      <text x="839" y="179" fill="#A3E635" font-family="JetBrains Mono, Consolas, monospace" font-size="14">"Shopify"</text>
      <text x="918" y="179" fill="#9EAAC6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">,</text>

      <text x="748" y="207" fill="#9EAAC6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">frontend:</text>
      <text x="839" y="207" fill="#F472B6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">["React", "Next.js"]</text>
      <text x="748" y="235" fill="#9EAAC6" font-family="JetBrains Mono, Consolas, monospace" font-size="14">delivery:</text>
      <text x="839" y="235" fill="#22D3EE" font-family="JetBrains Mono, Consolas, monospace" font-size="14">"performance_first"</text>
      <text x="728" y="263" fill="#F7F8FC" font-family="JetBrains Mono, Consolas, monospace" font-size="14">};</text>

      <circle cx="733" cy="286" r="4" fill="#A3E635" filter="url(#softGlow)"/>
      <text x="747" y="291" fill="#A3E635" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700">ready to ship</text>
      <rect x="847" y="281" width="7" height="13" rx="1" fill="#22D3EE" opacity="0.9"/>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="27.25" stroke="url(#accent)" stroke-opacity="0.42" stroke-width="1.5"/>
</svg>
